server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    # Everything is served from this origin (the API is proxied below), so the
    # policy allows only 'self'. No inline scripts or styles are used.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Re-resolve the API's address through Docker's DNS: with a literal host,
    # nginx resolves once at startup and keeps proxying to a dead address after
    # the api container is recreated (found when redeploying in M5).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Same-origin API access: the browser talks only to this server.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        proxy_pass $api_upstream;
    }

    # add_header in a location replaces the server-level headers, so assets
    # repeat the ones that matter for scripts and styles.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
