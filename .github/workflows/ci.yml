name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: paperpilot
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: paperpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      kafka:
        image: apache/kafka:4.2.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,EXTERNAL://127.0.0.1:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports: ["9094:9094"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 15s
    env:
      TEST_DATABASE_URL: postgresql+psycopg://paperpilot:ci-only@localhost:5432/paperpilot_test
      DATABASE_URL: postgresql+psycopg://paperpilot:ci-only@localhost:5432/paperpilot
      KAFKA_TEST_BOOTSTRAP: 127.0.0.1:9094
      REQUIRE_KAFKA: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest
      - name: Migrations apply to the main database
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run contrast
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start full stack (Kafka, workers; recorded OpenAlex sample, no live calls)
        run: docker compose up --build -d --wait
        env:
          PAPER_PROVIDER: fixture
      - name: Smoke test including the event pipeline
        run: ./scripts/smoke-test.sh http://localhost:8080
        env:
          EXPECT_PIPELINE: "1"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
