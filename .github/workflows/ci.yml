name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: paperpilot
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: paperpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://paperpilot:ci-only@localhost:5432/paperpilot_test
      DATABASE_URL: postgresql+psycopg://paperpilot:ci-only@localhost:5432/paperpilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest
      - name: Migrations apply to the main database
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run contrast
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start full stack
        run: docker compose up --build -d --wait
      - name: Smoke test
        run: ./scripts/smoke-test.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs
