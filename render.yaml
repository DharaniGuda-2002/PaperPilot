# Render Blueprint for the public demo (free plan). Database is Neon; see docs/deployment.md.
services:
  - type: web
    name: paperpilot-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Single free instance, so migrating at startup cannot race another instance.
    # Render runs dockerCommand through its own shell, so keep it a single script path.
    dockerCommand: ./start-with-migrations.sh
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Neon connection string; entered in the Render dashboard, never committed
      - key: CORS_ORIGINS
        value: https://paperpilot-web-tfx4.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: DAILY_INVESTIGATION_CAP
        value: "200"
      - key: CREATE_RATE_LIMIT_PER_MINUTE
        value: "5"

  - type: web
    name: paperpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paperpilot-api-2ykf.onrender.com
