# Render Blueprint for the public demo (free plan). Database is Neon; see docs/deployment.md.
services:
  - type: web
    name: paperpilot-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The Dockerfile's last stage is the small api image (no torch).
    # Single free instance, so migrating at startup cannot race another instance.
    # Render runs dockerCommand through its own shell, so keep it a single script path.
    dockerCommand: ./start-with-migrations.sh
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Neon connection string; entered in the Render dashboard, never committed
      - key: CORS_ORIGINS
        value: https://paperpilot-web-tfx4.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: DAILY_INVESTIGATION_CAP
        value: "200"
      - key: CREATE_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: OPENALEX_API_KEY
        sync: false  # free key from openalex.org/settings/api; add in the dashboard
      - key: DAILY_PROVIDER_CALL_CAP
        value: "500"
      - key: PAPER_SEARCH_RATE_LIMIT_PER_MINUTE
        value: "20"

  - type: web
    name: paperpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://paperpilot-api-2ykf.onrender.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paperpilot-api-2ykf.onrender.com
