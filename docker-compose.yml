# Full local stack. Copy .env.example to .env first (defaults work without it).
name: paperpilot

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-paperpilot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperpilot-local-only}
  POSTGRES_DB: ${POSTGRES_DB:-paperpilot}

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-paperpilot}:${POSTGRES_PASSWORD:-paperpilot-local-only}@db:5432/${POSTGRES_DB:-paperpilot}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
  PAPER_PROVIDER: ${PAPER_PROVIDER:-openalex}
  FIXTURE_PROVIDER_LATENCY_MS: ${FIXTURE_PROVIDER_LATENCY_MS:-0}
  DAILY_PROVIDER_CALL_CAP: ${DAILY_PROVIDER_CALL_CAP:-500}
  OPENALEX_BASE_URL: ${OPENALEX_BASE_URL:-https://api.openalex.org}
  DISCOVERY_MAX_ATTEMPTS: ${DISCOVERY_MAX_ATTEMPTS:-4}
  RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-30}
  DOCUMENT_FETCH_ENABLED: ${DOCUMENT_FETCH_ENABLED:-true}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}  # the frontend's nginx

# API, migrations, dispatcher, and discovery share the small `api` image; document
# and evidence workers use the `ml` image (PyMuPDF, torch CPU, embedding model).
# One service builds each image; the others reuse the tag (parallel builds collide).
x-backend: &backend
  image: paperpilot-backend:local
  pull_policy: never
  environment: *api-env

x-ml: &ml
  image: paperpilot-ml:local
  pull_policy: never
  environment: *api-env
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    migrate:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    environment: *db-env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations, then exits. The API waits for it to succeed.
  migrate:
    <<: *backend
    build:
      context: ./backend
      target: api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node KRaft broker: shows topics, partitions, and consumer groups;
  # it does not demonstrate broker redundancy.
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot: creates topics with fixed partition counts (auto-create is off).
  kafka-init:
    <<: *backend
    command: ["python", "-m", "app.events.topics"]
    depends_on:
      kafka:
        condition: service_healthy

  outbox-dispatcher:
    <<: *backend
    command: ["python", "-m", "app.workers.outbox_dispatcher"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  # Scale with: docker compose up -d --scale discovery-worker=3
  discovery-worker:
    <<: *backend
    command: ["python", "-m", "app.workers.discovery"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  report-worker:
    <<: *backend
    command: ["python", "-m", "app.workers.reports"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  document-worker:
    <<: *ml
    build:
      context: ./backend
      target: ml
    command: ["python", "-m", "app.workers.documents"]

  evidence-worker:
    <<: *ml
    command: ["python", "-m", "app.workers.evidence"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      document-worker:
        condition: service_started  # builds the shared ml image first

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  kafkadata:
