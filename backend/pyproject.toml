[project]
name = "paperpilot-backend"
version = "0.1.0"
description = "PaperPilot research investigation engine: API and workers"
requires-python = ">=3.12"
# Runtime and dev dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"app/evidence/rules.py" = ["E501"]  # pattern tables read better unwrapped
"app/reports/builder.py" = ["E501"]  # one-line family table

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF ships without complete type annotations.
module = [
    "app.documents.text",
    "tests.test_text",
    "tests.test_documents_worker",
    "tests.test_evidence_worker",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on import; not actionable here.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
